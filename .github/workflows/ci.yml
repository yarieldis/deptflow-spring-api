name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Runs unit tests, H2 integration tests, and Testcontainers tests
      # (PostgreSQL + SQL Server) - Docker is preinstalled on ubuntu-latest.
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t deptflow-api .
