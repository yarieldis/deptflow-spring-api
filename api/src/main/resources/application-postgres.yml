spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deptflow
    driver-class-name: org.postgresql.Driver
    username: deptflow
    password: deptflow
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
