server:
  port: 8080

spring:
  application:
    name: deptflow-api
  datasource:
    url: jdbc:sqlite:deptflow.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    open-in-view: false
    hibernate:
      # SQLite dev database. Flyway OSS has no SQLite module, so dev relies on
      # Hibernate ddl-auto; Postgres/SQL Server use Flyway via profiles.
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: false

deptflow:
  storage:
    root-path: ./storage
  jwt:
    # Dev-only secret (>= 32 bytes for HS256). Override in production.
    secret: change-me-this-is-a-dev-only-secret-key-please-rotate-0123456789
    expiration-minutes: 60
