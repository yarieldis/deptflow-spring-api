# SQL Server variant:  docker-compose -f docker-compose.sqlserver.yml up --build
# Note: the app connects to the default `master` database. For production, create
# a dedicated database first (e.g. via sqlcmd) and update SPRING_DATASOURCE_URL.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: sqlserver
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;encrypt=false;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      DEPTFLOW_JWT_SECRET: ${DEPTFLOW_JWT_SECRET:-change-me-in-production-rotate-this-0123456789abcdef}
      DEPTFLOW_STORAGE_ROOT_PATH: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/data/storage

volumes:
  app-storage:
