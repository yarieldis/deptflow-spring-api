services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deptflow
      POSTGRES_USER: deptflow
      POSTGRES_PASSWORD: deptflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deptflow -d deptflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deptflow
      SPRING_DATASOURCE_USERNAME: deptflow
      SPRING_DATASOURCE_PASSWORD: deptflow
      DEPTFLOW_JWT_SECRET: ${DEPTFLOW_JWT_SECRET:-change-me-in-production-rotate-this-0123456789abcdef}
      DEPTFLOW_STORAGE_ROOT_PATH: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/data/storage

volumes:
  postgres-data:
  app-storage:
